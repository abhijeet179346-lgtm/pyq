{% load static %}
<link rel="stylesheet" href="{% static 'portal/feedback.css' %}">
<button type="button" class="feedback-launch" aria-haspopup="dialog" aria-controls="feedback-dialog"><span aria-hidden="true">✦</span> Feedback</button>
<dialog id="feedback-dialog" class="feedback-dialog" aria-labelledby="feedback-title">
  <div class="feedback-dialog-header"><div><p class="feedback-eyebrow">We're listening</p><h2 id="feedback-title">Share feedback</h2></div><button type="button" class="feedback-close" aria-label="Close feedback">×</button></div>
  <p class="feedback-intro">Found a problem or have an idea? Tell us what happened.</p>
  <form method="post" action="{% url 'submit_feedback' %}" class="feedback-form">{% csrf_token %}
    <input type="hidden" name="page_path" value="{{ request.path }}">{% if question.pk %}<input type="hidden" name="question_id" value="{{ question.pk }}"><p class="feedback-context">This report will include the current question.</p>{% endif %}
    <label for="feedback-category">What would you like to share?</label>
    <select id="feedback-category" name="category"><option value="problem">Report a problem</option><option value="feedback">Share feedback</option></select>
    <label for="feedback-message">Details</label>
    <textarea id="feedback-message" name="message" rows="5" maxlength="2000" required placeholder="Tell us a little more…"></textarea>
    <p class="feedback-status" role="status" aria-live="polite"></p>
    <div class="feedback-actions"><button type="button" class="feedback-cancel">Cancel</button><button type="submit" class="feedback-submit">Send feedback</button></div>
  </form>
</dialog>
<script defer src="{% static 'portal/feedback.js' %}"></script>
