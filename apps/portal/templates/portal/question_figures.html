{% if figure_urls %}<div class="question-figures">{% for url in figure_urls %}<figure><a href="{{ url }}" target="_blank" rel="noopener" aria-label="Open figure {{ forloop.counter }} full size"><img src="{{ url }}" alt="Figure {{ forloop.counter }} for this question" loading="lazy"></a>{% if figure_urls|length > 1 %}<figcaption>Figure {{ forloop.counter }}</figcaption>{% endif %}</figure>{% endfor %}</div>{% endif %}
