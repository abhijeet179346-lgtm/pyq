<!doctype html><html><head><link rel="icon" href="/static/portal/favicon.svg" type="image/svg+xml"><link rel="icon" href="/static/portal/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/static/portal/apple-touch-icon.png"><meta charset="utf-8"><title>Ask from a photo</title></head><body><p><a href="{% url 'tutor_home' %}">Tutor</a></p><h1>Ask about a question photo</h1><p>AI transcribes first. Review the transcription before it is sent to the tutor.</p>{% for message in messages %}<p>{{ message }}</p>{% endfor %}<form method="post" enctype="multipart/form-data">{% csrf_token %}<label>Topic <select name="topic" required>{% for topic in topics %}<option value="{{ topic.pk }}">{{ topic.chapter.subject }} / {{ topic.chapter.name }} / {{ topic.name }}</option>{% endfor %}</select></label><p><input type="file" name="image" accept="image/png,image/jpeg" required></p><button name="stage" value="transcribe">Transcribe</button></form></body></html>
