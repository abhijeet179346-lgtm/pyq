{% load static %}<!doctype html><html lang="en"><head><link rel="stylesheet" href="{% static 'portal/tokens.css' %}"><link rel="stylesheet" href="{% static 'portal/ui.css' %}"><link rel="icon" href="{% static 'portal/favicon.svg' %}" type="image/svg+xml"><link rel="icon" href="{% static 'portal/favicon.ico' %}" sizes="any"><link rel="apple-touch-icon" href="{% static 'portal/apple-touch-icon.png' %}"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generate access codes</title><style>body{font:16px system-ui;max-width:720px;margin:2rem auto;padding:0 1rem}form{display:grid;gap:.7rem}button{padding:.7rem;background:var(--accent);color:white;border:0}</style></head><body><h1>Generate batch access codes</h1><p>Codes are shown only in the downloaded CSV. Keep it private and distribute it to the intended batch.</p><form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Generate and download CSV</button></form></body></html>
