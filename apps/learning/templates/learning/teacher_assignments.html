{% load static %}<!doctype html><html lang="en"><head><link rel="stylesheet" href="{% static 'portal/tokens.css' %}"><link rel="stylesheet" href="{% static 'portal/ui.css' %}"><link rel="icon" href="{% static 'portal/favicon.svg' %}" type="image/svg+xml"><link rel="icon" href="{% static 'portal/favicon.ico' %}" sizes="any"><link rel="apple-touch-icon" href="{% static 'portal/apple-touch-icon.png' %}"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher assignments</title><style>body{font:16px system-ui;max-width:900px;margin:2rem auto;padding:0 1rem}table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--line-strong);padding:.55rem;text-align:left}</style></head><body><h1>Teacher subject assignments</h1><form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Save assignment</button></form><h2>Current assignments</h2><table><tr><th>Teacher</th><th>Subject</th><th>Batch</th></tr>{% for item in assignments %}<tr><td>{{ item.teacher }}</td><td>{{ item.subject }}</td><td>{{ item.batch|default:"All batches" }}</td></tr>{% empty %}<tr><td colspan="3">No assignments.</td></tr>{% endfor %}</table></body></html>
