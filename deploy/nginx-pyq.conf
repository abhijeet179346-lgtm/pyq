server {
    listen 80;
    server_name __PUBLIC_HOST__;
    client_max_body_size 100m;   # PDF uploads up to 100 MB

    location /static/ {
        alias /opt/pyq/app/staticfiles/;
        expires 7d;
        access_log off;
    }
    location = /favicon.ico {
        alias /opt/pyq/app/staticfiles/portal/favicon.ico;
        access_log off;
    }
    # Private media is served only through authenticated Django views.
    location /private-media/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
